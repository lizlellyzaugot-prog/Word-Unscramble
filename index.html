<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Unscramble Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .hidden { display: none !important; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover { background: #764ba2; }
        h1 { margin-bottom: 20px; color: #333; }
        p { color: #666; margin-bottom: 15px; line-height: 1.6; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .category-btn { background: #f0f0f0; color: #333; padding: 15px; margin: 10px 0; text-align: left; }
        .category-btn:hover { background: #667eea; color: white; }
        .word-display { font-size: 48px; font-weight: bold; letter-spacing: 10px; color: #333; margin: 30px 0; text-align: center; }
        .gamearea { display: none; }
        .gamearea.active { display: block; }
    </style>
</head>
<body>
    <!-- Welcome Modal -->
    <div id="welcomeModal" class="modal">
        <div class="modal-content">
            <h1>🎮 Word Unscramble Game</h1>
            <p>Unscramble the letters to find the correct word!</p>
            <p>Choose your difficulty level and try to guess as many words as you can.</p>
            <button onclick="goToNameInput()">Let's Play! 🚀</button>
        </div>
    </div>

    <!-- Name Input Modal -->
    <div id="nameModal" class="modal hidden">
        <div class="modal-content">
            <h1>Welcome!</h1>
            <p>Enter your name:</p>
            <input type="text" id="playerName" placeholder="Your name" autofocus>
            <button onclick="goToCategories()">Continue</button>
        </div>
    </div>

    <!-- Category Selection -->
    <div id="categoryModal" class="modal hidden">
        <div class="modal-content">
            <h1>Select Category</h1>
            <button class="category-btn" onclick="startGame('travel')">✈️ Travel</button>
            <button class="category-btn" onclick="startGame('politics')">🗳️ Philippine Politics</button>
            <button class="category-btn" onclick="startGame('geography')">🗺️ Asian Geography</button>
            <button class="category-btn" onclick="startGame('animals')">🦁 Animals</button>
        </div>
    </div>

    <!-- Game Area -->
    <div id="gameArea" class="modal gamearea">
        <div class="modal-content">
            <h1 id="gameTitle">Level 1</h1>
            <p id="playerInfo">Player: <span id="playerNameDisplay">Player</span></p>
            <div class="word-display" id="scrambledWord">EXAMPLE</div>
            <input type="text" id="answerInput" placeholder="Type your answer" autofocus>
            <button onclick="checkAnswer()">Submit Answer</button>
            <button onclick="skipWord()">Skip Word</button>
            <p id="feedback" style="color: #28a745; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        // Game data
        const gameData = {
            travel: {
                easy: ['DESK', 'TRIP', 'MAPS', 'CARD', 'PORT', 'TAXI', 'GATE', 'CAB', 'TRAIN', 'BUS'],
                moderate: ['HOTEL', 'TICKET', 'AGENTS', 'KIOSK', 'QUEUE', 'CABIN', 'RUNWAY', 'PILOT', 'VOYAGE', 'CUSTOMS'],
                difficult: ['ITINERARY', 'DEPARTURE', 'AIRCRAFT', 'PASSPORT', 'TRANSIT', 'DESTINATION', 'CONNECTION', 'TERMINAL', 'NAVIGATION']
            },
            politics: {
                easy: ['VOTE', 'ALLOW', 'WILL', 'LAWS', 'SENATE', 'RESIDENT', 'LEADER', 'PARTY', 'BILL', 'MAYOR'],
                moderate: ['CONGRESS', 'ELECTION', 'CAMPAIGN', 'BALLOT', 'DIPLOMAT', 'MINISTER', 'CABINET', 'LEGISLATOR', 'GOVERNOR', 'COUNCIL'],
                difficult: ['CONSTITUTIONAL', 'CORRUPTION', 'PROSECUTION', 'SOVEREIGNTY', 'AMENDMENT']
            },
            geography: {
                easy: ['MANILA', 'JAPAN', 'SEOUL', 'BANGKOK', 'HANOI', 'CHINA', 'KOREA', 'LAOS', 'ASIA', 'BALI'],
                moderate: ['ILOILO', 'DAVAO', 'BAGUIO', 'SINGAPORE', 'MALAYSIA', 'INDONESIA', 'THAILAND', 'MYANMAR', 'VIETNAM', 'CAMBODIA'],
                difficult: ['GEOPOLITICAL', 'INSTITUTIONAL', 'TERRITORALSTATES']
            },
            animals: {
                easy: ['DOG', 'ZEBRA', 'SNAKE', 'FISH', 'REINDEER', 'CAT', 'BIRD', 'LION', 'BEAR', 'DEER'],
                moderate: ['ELEPHANT', 'GIRAFFE', 'CROCODILE', 'RABBIT', 'HIPPOPOTAMUS', 'CHEETAH', 'TIGER', 'MONKEY', 'PENGUIN', 'DOLPHIN'],
                difficult: ['NOCTURNAL', 'PREDATOR', 'TARANTULA', 'SCORPION', 'MAMMALS']
            }
        };

        let gameState = {
            playerName: '',
            category: '',
            level: 1,
            words: [],
            currentWord: 0,
            score: 0,
            skipped: 0
        };

        // Show functions
        function goToNameInput() {
            document.getElementById('welcomeModal').classList.add('hidden');
            document.getElementById('nameModal').classList.remove('hidden');
            document.getElementById('playerName').focus();
        }

        function goToCategories() {
            gameState.playerName = document.getElementById('playerName').value || 'Player';
            document.getElementById('nameModal').classList.add('hidden');
            document.getElementById('categoryModal').classList.remove('hidden');
        }

        function startGame(category) {
            gameState.category = category;
            gameState.playerName = document.getElementById('playerName').value || 'Player';
            gameState.words = gameData[category].easy;
            gameState.currentWord = 0;
            gameState.score = 0;
            gameState.skipped = 0;
            
            document.getElementById('categoryModal').classList.add('hidden');
            document.getElementById('gameArea').classList.add('active');
            document.getElementById('playerNameDisplay').textContent = gameState.playerName;
            
            showNextWord();
        }

        function showNextWord() {
            if (gameState.currentWord >= gameState.words.length) {
                endGame();
                return;
            }
            
            const word = gameState.words[gameState.currentWord];
            const scrambled = word.split('').sort(() => Math.random() - 0.5).join('');
            
            document.getElementById('scrambledWord').textContent = scrambled;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('answerInput').focus();
        }

        function checkAnswer() {
            const answer = document.getElementById('answerInput').value.toUpperCase();
            const correctAnswer = gameState.words[gameState.currentWord];
            
            if (answer === correctAnswer) {
                gameState.score++;
                document.getElementById('feedback').textContent = '✓ Correct!';
                document.getElementById('feedback').style.color = '#28a745';
            } else {
                document.getElementById('feedback').textContent = '✗ Wrong! Answer: ' + correctAnswer;
                document.getElementById('feedback').style.color = '#dc3545';
            }
            
            setTimeout(() => {
                gameState.currentWord++;
                showNextWord();
            }, 1500);
        }

        function skipWord() {
            gameState.skipped++;
            gameState.currentWord++;
            showNextWord();
        }

        function endGame() {
            document.getElementById('gameArea').classList.remove('active');
            document.getElementById('categoryModal').classList.remove('hidden');
            alert(`Game Over!\n\nName: ${gameState.playerName}\nCorrect: ${gameState.score}\nSkipped: ${gameState.skipped}\nScore: ${gameState.score}/${gameState.words.length}`);
            resetGame();
        }

        function resetGame() {
            document.getElementById('welcomeModal').classList.remove('hidden');
            document.getElementById('categoryModal').classList.add('hidden');
            document.getElementById('nameModal').classList.add('hidden');
            document.getElementById('gameArea').classList.remove('active');
            gameState = {
                playerName: '',
                category: '',
                level: 1,
                words: [],
                currentWord: 0,
                score: 0,
                skipped: 0
            };
        }

        // Make sure functions are globally accessible
        window.goToNameInput = goToNameInput;
        window.goToCategories = goToCategories;
        window.startGame = startGame;
        window.checkAnswer = checkAnswer;
        window.skipWord = skipWord;
    </script>
</body>
</html>
